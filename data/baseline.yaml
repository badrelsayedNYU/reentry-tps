# Baseline entry case and wall layup. Design inputs, each with a source or stated as an assumption.
# Material properties and temperature limits live in materials.yaml.
# Any TODO stops the analysis with a list of what is missing.

mission:
  V_E: TODO              # entry velocity at the interface [m/s]
  gamma_E_deg: TODO      # entry flight-path angle [deg], negative
  beta: TODO             # ballistic coefficient m/(C_D A) [kg/m^2]
  lift_to_drag: TODO     # L/D [-] (0 = ballistic)
  nose_radius: TODO      # stagnation-point nose radius R_n [m]
  h_E: 120000            # entry interface [m] (spec section 2.2)
  V_cutoff: 500          # end of the hypersonic heating phase [m/s] (spec section 2.2)
  source: "TODO: source, or 'representative LEO capsule (assumed)'"

wall:
  heat_shield: li900     # key in materials.yaml (sweeps also compare li2200, frci12)
  bondline: rtv560
  structure: al2219
  bondline_thickness: TODO     # [m]
  structure_thickness: TODO    # [m]
  initial_temperature: TODO    # whole wall at entry interface [K]
  hot_wall: false              # spec section 3, optional correction
  source: "TODO: source for the thicknesses and initial temperature"

numerics:                # set by the convergence study (milestone 5)
  shield_cells: 60
  shield_stretch: 1.05   # cells cluster at the hot surface
  bondline_cells: 4
  structure_cells: 6
  dt: 0.5                # [s]
  soak_time: 1800        # initial soak window after heating [s]; extended automatically if the
                         # bondline is still heating when it ends
